services:
  db:
    image: postgres:16
    container_name: website-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    container_name: website-rustfs
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_USER}
      RUSTFS_SECRET_KEY: ${S3_PASSWORD}
      RUSTFS_VOLUMES: /data
    volumes:
      - ./data/s3:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 9000:9000
      - 9001:9001
  create-bucket:
    image: rustfs/rc:v0.1.36
    depends_on:
      s3:
        condition: service_healthy
    restart: no
    container_name: website-create-bucket
    entrypoint: >
      /bin/sh -c "
      /usr/bin/rc alias set rustfs http://website-minio:9000 ${S3_USER} ${S3_PASSWORD} --region us-east-1 --bucket-lookup path;
      /usr/bin/rc bucket create rustfs/${S3_NAME} --ignore-existing;
      exit 0;
      "
